<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">OAS 开放系统目标架构</title><desc id="desc">从应用价值到智能体协作核心、执行能力与知识资产基础，安全治理和评测贯穿各层。层次表示职责，非固定执行顺序。</desc><rect width="1200" height="900" fill="#fafafa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="48" y="43" fill="#646b70" font-size="11" font-weight="500" text-anchor="start">OPEN AGENT SYSTEMS / ECOSYSTEM ARCHITECTURE</text><text x="48" y="91" fill="#292d30" font-size="32" font-weight="600" text-anchor="start">围绕智能执行，共建开放基础。</text><text x="48" y="123" fill="#646b70" font-size="15" font-weight="400" text-anchor="start">从应用价值到可组合的基础能力，让独立项目在清晰的边界中协作。</text><path d="M48 151L1152 151" stroke="#d6dadd" stroke-width="1" fill="none"/><text x="48" y="198" fill="#a85e45" font-size="11" font-weight="500" text-anchor="start">01 / OUTCOMES</text><text x="48" y="224" fill="#292d30" font-size="17" font-weight="600" text-anchor="start">应用与开发体验</text><text x="48" y="246" fill="#646b70" font-size="11" font-weight="400" text-anchor="start">需求牵引 · 面向使用者</text><g transform="translate(300 195) scale(1.0)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18"/></g><text x="336" y="213" fill="#292d30" font-size="19" font-weight="600" text-anchor="start">研发交付</text><g transform="translate(535 195) scale(1.0)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 4 3 6-8M17 5h4v4"/></g><text x="571" y="213" fill="#292d30" font-size="19" font-weight="600" text-anchor="start">智能运维</text><g transform="translate(770 195) scale(1.0)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8a4 4 0 0 1 4-4h10m-4-4 4 4-4 4"/><circle cx="5" cy="20" r="2"/></g><text x="806" y="213" fill="#292d30" font-size="19" font-weight="600" text-anchor="start">业务自动化</text><text x="300" y="249" fill="#646b70" font-size="12" font-weight="400" text-anchor="start">SDK / CLI</text><text x="455" y="249" fill="#646b70" font-size="12" font-weight="400" text-anchor="start">调试与交付</text><text x="650" y="249" fill="#646b70" font-size="12" font-weight="400" text-anchor="start">真实场景与反馈</text><path d="M260 276L965 276" stroke="#d6dadd" stroke-width="1" fill="none"/><text x="48" y="324" fill="#a85e45" font-size="11" font-weight="500" text-anchor="start">02 / COORDINATION</text><text x="48" y="350" fill="#292d30" font-size="17" font-weight="600" text-anchor="start">智能体协作核心</text><text x="48" y="372" fill="#646b70" font-size="11" font-weight="400" text-anchor="start">组织能力 · 管理任务</text><path d="M260 298H965V416H260Z" fill="#eceeef"/><g transform="translate(287 326) scale(1.6666666666666667)" fill="none" stroke="#a85e45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="12" cy="21" r="2"/><path d="m6 6 3 3m9-3-3 3m-3 7v3"/></g><text x="352" y="344" fill="#292d30" font-size="24" font-weight="600" text-anchor="start">智能体编排与协作</text><text x="352" y="375" fill="#646b70" font-size="14" font-weight="400" text-anchor="start">任务规划  /  能力调用  /  多智能体协作  /  人工介入</text><path d="M608 416L608 450" stroke="#abb2b7" stroke-width="1.5" fill="none"/><path d="M376 450L840 450" stroke="#abb2b7" stroke-width="1.5" fill="none"/><path d="M376 450L376 466" stroke="#abb2b7" stroke-width="1.5" fill="none"/><path d="M608 450L608 466" stroke="#abb2b7" stroke-width="1.5" fill="none"/><path d="M840 450L840 466" stroke="#abb2b7" stroke-width="1.5" fill="none"/><text x="48" y="493" fill="#a85e45" font-size="11" font-weight="500" text-anchor="start">03 / EXECUTION</text><text x="48" y="519" fill="#292d30" font-size="17" font-weight="600" text-anchor="start">可组合执行能力</text><text x="48" y="541" fill="#646b70" font-size="11" font-weight="400" text-anchor="start">独立接入 · 按需组合</text><g transform="translate(360 483) scale(1.3333333333333333)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="3"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3M10 10h4v4h-4z"/></g><text x="376" y="546" fill="#292d30" font-size="18" font-weight="600" text-anchor="middle">模型与网关</text><text x="376" y="574" fill="#646b70" font-size="12" font-weight="400" text-anchor="middle">接入 · 路由 · 配额</text><g transform="translate(592 483) scale(1.3333333333333333)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m10 8 2-2a5 5 0 0 1 7 7l-3 3a5 5 0 0 1-7 0m5 0-2 2a5 5 0 0 1-7-7l3-3a5 5 0 0 1 7 0m-6 6 6-6"/></g><text x="608" y="546" fill="#292d30" font-size="18" font-weight="600" text-anchor="middle">工具与连接</text><text x="608" y="574" fill="#646b70" font-size="12" font-weight="400" text-anchor="middle">API · MCP · 外部系统</text><g transform="translate(824 483) scale(1.3333333333333333)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10m-5-6 2 1m6-2 3-2"/></g><text x="840" y="546" fill="#292d30" font-size="18" font-weight="600" text-anchor="middle">运行与沙箱</text><text x="840" y="574" fill="#646b70" font-size="12" font-weight="400" text-anchor="middle">隔离 · 调度 · 恢复</text><path d="M260 601L965 601" stroke="#d6dadd" stroke-width="1" fill="none"/><text x="48" y="642" fill="#a85e45" font-size="11" font-weight="500" text-anchor="start">04 / FOUNDATION</text><text x="48" y="668" fill="#292d30" font-size="17" font-weight="600" text-anchor="start">知识与资产基础</text><text x="48" y="690" fill="#646b70" font-size="11" font-weight="400" text-anchor="start">支撑执行 · 积累复用</text><g transform="translate(291 638) scale(1.2083333333333333)" fill="none" stroke="#292d30" stroke-width="1.4