<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">OAS target ecosystem architecture</title><desc id="desc">Application outcomes, agent coordination, execution capabilities and knowledge foundations, with governance and evaluation across all layers. Layers describe responsibilities, not a fixed execution sequence.</desc><rect width="1200" height="900" fill="#fafafa" /><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="48" y="43" fill="#646b70" font-size="11" font-weight="500" text-anchor="start">OPEN AGENT SYSTEMS / ECOSYSTEM ARCHITECTURE</text><text x="48" y="91" fill="#292d30" font-size="32.0" font-weight="600" text-anchor="start">Open foundations for intelligent execution.</text><text x="48" y="123" fill="#646b70" font-size="15.0" font-weight="400" text-anchor="start">Connect application needs with composable capabilities, through clear boundaries between independent projects.</text><path d="M48 151L1152 151" stroke="#d6dadd" stroke-width="1" fill="none" /><text x="48" y="198" fill="#a85e45" font-size="11" font-weight="500" text-anchor="start">01 / OUTCOMES</text><text x="48" y="224" fill="#292d30" font-size="17.0" font-weight="600" text-anchor="start">Applications &amp; DX</text><text x="48" y="246" fill="#646b70" font-size="11.0" font-weight="400" text-anchor="start">Driven by real needs</text><g transform="translate(300 195) scale(1.0)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18" /></g><text x="336" y="213" fill="#292d30" font-size="17" font-weight="600" text-anchor="start">Software delivery</text><g transform="translate(535 195) scale(1.0)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 4 3 6-8M17 5h4v4" /></g><text x="571" y="213" fill=