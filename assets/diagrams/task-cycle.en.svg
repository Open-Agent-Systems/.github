<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">OAS task lifecycle</title><desc id="desc">Define, plan, execute, validate and deliver. Approval is policy-driven, checkpoints support recovery, failed validation leads to replanning, and validated assets support future tasks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5 0 9" fill="none" stroke="#a85e45" stroke-width="1.5" /></marker></defs><rect width="1200" height="900" fill="#fafafa" /><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="48" y="43" fill="#646b70" font-size="11" font-weight="500" text-anchor="start">OPEN AGENT SYSTEMS / TASK LIFECYCLE</text><text x="48" y="91" fill="#292d30" font-size="32.0" font-weight="600" text-anchor="start">Complete the work. Build reusable capability.</text><text x="48" y="123" fill="#646b70" font-size="15.0" font-weight="400" text-anchor="start">A clear execution path, controlled actions, verified results and experience that supports future work.</text><path d="M48 151H1152" stroke="#cbd0d3" stroke-width="1.5" fill="none" /><text x="48" y="195" fill="#a85e45" font-size="13.0" font-weight="600" text-anchor="start">CROSS-CUTTING</text><text x="238" y="195" fill="#292d30" font-size="14.0" font-weight="400" text-anchor="start">Identity &amp; access</text><text x="440" y="195" fill="#292d30" font-size="14.0" font-weight="400" text-anchor="start">Policy &amp; budgets</text><text x="642" y="195" fill="#292d30" font-size="14.0" font-weight="400" text-anchor="start">Execution traces</text><text x="844" y="195" fill="#292d30" font-size="14.0" font-weight="400" text-anchor="start">Quality &amp; cost</text><path d="M48 218H1152" stroke="#cbd0d3" stroke-width="1.5" fill="none" /><path d="M110 345H1050" stroke="#b4bbc0" stroke-width="1.5" fill="none" /><g transform="translate(93 273) scale(1.4166666666666667)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="m16 8-2 6-6 2 2-6z" /></g><circle cx="110" cy="345" r="6" fill="#292d30" stroke="#fafafa" stroke-width="4" /><text x="110" y="382" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="middle">01 / Define</text><text x="110" y="411" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="middle">Inputs · Constraints · Acceptance</text><text x="226" y="338" fill="#646b70" font-size="17" font-weight="400" text-anchor="middle">→</text><g transform="translate(328 273) scale(1.4166666666666667)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><circle cx="4" cy="4" r="2" /><circle cx="20" cy="4" r="2" /><circle cx="12" cy="21" r="2" /><path d="m6 6 3 3m9-3-3 3m-3 7v3" /></g><circle cx="345" cy="345" r="6" fill="#292d30" stroke="#fafafa" stroke-width="4" /><text x="345" y="382" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="middle">02 / Plan</text><text x="345" y="411" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="middle">Break down work · Compose</text><text x="461" y="338" fill="#646b70" font-size="17" font-weight="400" text-anchor="middle">→</text><g transform="translate(563 273) scale(1.4166666666666667)" fill="none" stroke="#a85e45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10m-5-6 2 1m6-2 3-2" /></g><circle cx="580" cy="345" r="6" fill="#a85e45" stroke="#fafafa" stroke-width="4" /><text x="580" y="382" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="middle">03 / Execute</text><text x="580" y="411" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="middle">Models &amp; tools · Isolation</text><text x="696" y="338" fill="#646b70" font-size="17" font-weight="400" text-anchor="middle">→</text><g transform="translate(798 273) scale(1.4166666666666667)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 4 3 6-8M17 5h4v4" /></g><circle cx="815" cy="345" r="6" fill="#292d30" stroke="#fafafa" stroke-width="4" /><text x="815" y="382" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="middle">04 / Validate</text><text x="815" y="411" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="middle">Quality · Evidence · Cost</text><text x="931" y="338" fill="#646b70" font-size="17" font-weight="400" text-anchor="middle">→</text><g transform="translate(1033 273) scale(1.4166666666666667)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 6-10 6L2 8zM2 12l10 6 10-6M2 16l10 6 10-6" /></g><circle cx="1050" cy="345" r="6" fill="#292d30" stroke="#fafafa" stroke-width="4" /><text x="1050" y="382" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="middle">05 / Deliver</text><text x="1050" y="411" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="middle">Artifacts · Usage · Evidence</text><path d="M580 429V458" stroke="#cbd0d3" stroke-width="1.5" fill="none" /><text x="442" y="487" fill="#a85e45" font-size="11.0" font-weight="500" text-anchor="start">BEFORE</text><text x="520" y="487" fill="#292d30" font-size="11.5" font-weight="400" text-anchor="start">Policy checks and human approval as needed</text><text x="442" y="515" fill="#a85e45" font-size="11.0" font-weight="500" text-anchor="start">DURING</text><text x="520" y="515" fill="#292d30" font-size="11.5" font-weight="400" text-anchor="start">Checkpoints for controlled retries and recovery</text><path d="M815 429V557Q815 571 801 571H359Q345 571 345 557V429" stroke="#a85e45" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="580" y="599" fill="#a85e45" font-size="13.0" font-weight="500" text-anchor="middle">Validation failed → add context, revise the plan, retry</text><path d="M48 644H1152V744H48Z" fill="#eceeef" /><g transform="translate(70 676) scale(1.1666666666666667)" fill="none" stroke="#292d30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0" /></g><text x="118" y="679" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="start">Build reusable capability</text><text x="118" y="708" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="start">Select · Validate · Version</text><path d="M1050 429V644" stroke="#cbd0d3" stroke-width="1.5" fill="none" /><text x="1063" y="544" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="start">After delivery</text><text x="430" y="683" fill="#292d30" font-size="14" font-weight="500" text-anchor="start">Knowledge / Skills / Templates / Environments</text><text x="430" y="711" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="start">Turn useful outcomes into traceable, validated assets</text><text x="850" y="684" fill="#292d30" font-size="18.0" font-weight="600" text-anchor="start">→  Support future work</text><text x="883" y="712" fill="#646b70" font-size="11.5" font-weight="400" text-anchor="start">Start with new goals and constraints</text><text x="48" y="786" fill="#292d30" font-size="13.0" font-weight="600" text-anchor="start">Pause &amp; exit</text><text x="238" y="786" fill="#646b70" font-size="13.0" font-weight="400" text-anchor="start">Access denied, budget exhausted or retry limit reached: preserve state and reasons; pause, stop or hand off.</text><path d="M48 836H1152" stroke="#cbd0d3" stroke-width="1.5" fill="none" /><text x="48" y="865" fill="#646b70" font-size="12.0" font-weight="400" text-anchor="start">Target workflow: collaboration and control points, not a fixed product implementation or shipped features.</text><text x="1152" y="865" fill="#646b70" font-size="11" font-weight="400" text-anchor="end">OAS / CONCEPT PREVIEW</text></g></svg>